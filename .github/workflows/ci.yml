name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Roblox tools (aftman.toml)
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: StyLua
        run: stylua --check src --glob '!src/TracyModule/**'

      - name: selene
        run: |
          selene generate-roblox-std
          selene src

      - name: Build TracyLuau.rbxm
        run: rojo build default.project.json --output TracyLuau.rbxm

      - uses: actions/upload-artifact@v4
        with:
          name: TracyLuau.rbxm
          path: TracyLuau.rbxm

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TracyLuau.rbxm

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          {
            echo
            echo "---"
            echo "Luau is a trademark of Roblox Corporation. Tracy-Luau is an independent project,"
            echo "not affiliated with or endorsed by Roblox, the Luau team, or the Tracy project."
          } >> notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" TracyLuau.rbxm --title "Tracy-Luau Plugin $GITHUB_REF_NAME" --notes-file notes.md
